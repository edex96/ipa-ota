# /etc/nginx/conf.d/ota.example.com.conf
# Requires: a cert at /etc/letsencrypt/live/ota.example.com/ (certbot --nginx -d ota.example.com)
# and a password file at /etc/nginx/ipa-ota.htpasswd (see deploy/README-deploy.md).
server {
    server_name ota.example.com;

    # .ipa uploads are large; nginx defaults to 1m and would 413 every real build
    client_max_body_size 2048m;

    # shared proxy settings — inherited by every location below
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # --- public: iOS fetches these with no credentials it could ever supply ---

    # the payload: stream it, no temp-file buffering, keep range support
    # (regex is quoted because nginx would otherwise read {8} as a block)
    location ~ "^/i/[a-f0-9]{8}/app\.ipa$" {
        proxy_pass http://127.0.0.1:3010;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }

    # install page, manifest.plist, icon, unlock form — each link carries its own
    # optional password token, enforced by the app
    location /i/ {
        proxy_pass http://127.0.0.1:3010;
    }

    # css/js for the public install pages
    location /assets/ {
        proxy_pass http://127.0.0.1:3010;
    }

    # --- private: upload UI, link list, delete ---
    location / {
        auth_basic "ipa-ota";
        auth_basic_user_file /etc/nginx/ipa-ota.htpasswd;

        proxy_pass http://127.0.0.1:3010;
        # stream uploads straight to node instead of spooling them to disk first
        proxy_request_buffering off;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/ota.example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ota.example.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = ota.example.com) {
        return 301 https://$host$request_uri;
    }

    server_name ota.example.com;
    listen 80;
    listen [::]:80;
    return 404;
}
